name: Container

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"

env:
  IMAGE_NAME: ghcr.io/sjefferson99/simple-runner-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (both architectures, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 only, loaded locally, for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          cache-from: type=gha

      - name: Smoke test /healthz
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e SR_SECRET_KEY=ci-smoke-test-key \
            ${{ env.IMAGE_NAME }}:smoke-test
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
