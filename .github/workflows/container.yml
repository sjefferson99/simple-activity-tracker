name: Container

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"

env:
  IMAGE_NAME: ghcr.io/sjefferson99/simple-activity-tracker-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build (both architectures, not pushed)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 only, loaded locally, for the smoke test
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          cache-from: type=gha

      - name: Smoke test /healthz
        run: |
          mkdir -p /tmp/sr-smoke-data
          chmod 777 /tmp/sr-smoke-data
          docker run -d --name smoke -p 8000:8000 \
            -e SR_SECRET_KEY=ci-smoke-test-key-not-a-real-secret-32chars \
            -v /tmp/sr-smoke-data:/data \
            ${{ env.IMAGE_NAME }}:smoke-test
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs smoke
          exit 1

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Validate deploy/standalone-tls/nginx.conf
        run: |
          # nginx -t resolves `proxy_pass http://app:8000` upstreams at parse
          # time, so it needs *something* answering to the hostname "app" —
          # a throwaway container on a dedicated network alias is enough,
          # nginx never actually proxies a request to it. certs/*.pem are
          # gitignored (real deployments generate their own), so a throwaway
          # self-signed cert stands in just so the paths resolve.
          mkdir -p /tmp/nginx-check-certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/nginx-check-certs/key.pem \
            -out /tmp/nginx-check-certs/cert.pem \
            -subj "/CN=nginx-check"
          docker network create nginx-check
          docker run -d --name fake-app --network nginx-check --network-alias app nginx:alpine
          docker run --rm --network nginx-check \
            -v "$PWD/deploy/standalone-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/nginx-check-certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t
          docker rm -f fake-app
          docker network rm nginx-check

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
