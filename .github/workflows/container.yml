name: Container

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    # Applies to both branches and tags above (GitHub ANDs paths with
    # branches/tags) — fine in practice since a release tag is only ever cut
    # right after a merge that changed the server, so the diff always
    # includes server/** even if the tagged commit itself is a no-op.
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"

env:
  IMAGE_NAME: ghcr.io/sjefferson99/simple-activity-tracker-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags, so release-version.sh can `git describe`.
          fetch-depth: 0

      - name: Compute release version
        id: version
        # 1.3.0 on a v1.3.0 tag, 1.3.0+4.gabc1234 on main — baked into the
        # image and shown in the web footer / server-info (docs/VERSIONING.md).
        run: echo "app_version=$(./scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (both architectures, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 only, loaded locally, for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          cache-from: type=gha

      - name: Smoke test /healthz
        run: |
          mkdir -p /tmp/sr-smoke-data
          chmod 777 /tmp/sr-smoke-data
          docker run -d --name smoke -p 8000:8000 \
            -e SR_SECRET_KEY=ci-smoke-test-key-not-a-real-secret-32chars \
            -e SR_ENABLE_API_DOCS=true \
            -v /tmp/sr-smoke-data:/data \
            ${{ env.IMAGE_NAME }}:smoke-test
          # SR_ENABLE_API_DOCS only so /healthz includes the version — proves
          # the APP_VERSION build arg actually reached the running app.
          expected='"version":"${{ steps.version.outputs.app_version }}"'
          for i in $(seq 1 15); do
            if body=$(curl -sf http://127.0.0.1:8000/healthz); then
              echo "$body"
              case "$body" in
                *"$expected"*) echo "healthz OK"; exit 0 ;;
                *) echo "healthz reported the wrong version (expected $expected)"; exit 1 ;;
              esac
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs smoke
          exit 1

      - name: Scan image for known vulnerabilities (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Neither is a named trivy-action input — trivy itself reads these
          # env vars (docs: configuration/#environment-variables).
          # TABLE_MODE=detailed drops the "Report Summary" table (one row
          # per *scanned target*, e.g. every Python package's METADATA file
          # — dozens of clean rows for this image) and keeps only the
          # actual per-CVE findings table; DISABLE_VEX_NOTICE drops an
          # unrelated boilerplate paragraph about VEX statements. Neither
          # changes what's detected, only what's printed — confirmed live
          # on PR #86's own comment: 172 lines down to 56, same 12 findings.
          TRIVY_TABLE_MODE: detailed
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Reports rather than blocks (see below) — Debian's own security
          # advisories routinely land days before the fixed .deb packages
          # actually reach apt, so a HIGH/CRITICAL finding here can mean
          # "no fix exists yet anywhere," not "this build regressed." A
          # gate that fails on that is a gate every PR fails until an
          # unrelated upstream catches up, which trains everyone to ignore
          # red Container checks rather than read them.
          exit-code: 0
          format: table
          output: trivy-results.txt

      - name: Flag any findings in the job summary
        id: trivy_findings
        if: always()
        run: |
          # trivy writes the table to --output instead of stdout, so echo it
          # back into the job log too — anyone tailing Actions output
          # shouldn't have to open the summary tab to see what was found.
          cat trivy-results.txt
          if [ -s trivy-results.txt ] && grep -q "Total: [1-9]" trivy-results.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Trivy found HIGH/CRITICAL OS package CVEs"
              echo
              echo "This does **not** fail the build — see \`.github/workflows/container.yml\`"
              echo "for why. Check whether the app's own code path actually reaches the"
              echo "flagged package (most OS-level CVEs in a slim Python base image are in"
              echo "utilities this app never invokes — gzip, perl, etc.) before assuming"
              echo "real exposure. Re-run this workflow once Dependabot or a manual rebuild"
              echo "picks up patched packages from upstream."
              echo
              echo '```'
              cat trivy-results.txt
              echo '```'
            } | tee trivy-comment.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # A job summary is only ever seen if someone opens the run, which in
      # practice means "in hindsight, if at all" — a PR comment lands in the
      # same conversation feed and notification email as a human reviewer's
      # comment, which is what actually gets read before merging. One sticky
      # comment per PR: re-runs update it in place rather than piling up
      # duplicates, and it's removed entirely once a later commit's scan
      # comes back clean (a stale "here be dragons" comment is worse than
      # none once it no longer reflects the current commit).
      # Note for a future fork-originated PR: this workflow runs on
      # `pull_request` (not `pull_request_target`), so GITHUB_TOKEN is
      # read-only for a fork PR regardless of the `permissions:` block above
      # — these two steps would then silently no-op rather than error. Not a
      # concern for this single-owner repo today; worth knowing if that ever
      # changes.
      - name: Post/update PR comment with any findings
        if: github.event_name == 'pull_request' && steps.trivy_findings.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-scan
          path: trivy-comment.md

      - name: Remove stale PR comment when the scan is clean
        if: github.event_name == 'pull_request' && steps.trivy_findings.outputs.found == 'false'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-scan
          delete: true

      - name: Validate deploy/standalone-tls/nginx.conf
        run: |
          # nginx -t resolves `proxy_pass http://app:8000` upstreams at parse
          # time, so it needs *something* answering to the hostname "app" —
          # a throwaway container on a dedicated network alias is enough,
          # nginx never actually proxies a request to it. Uses the real
          # generate-cert.sh (certs/*.pem are gitignored, so nothing here
          # gets committed) rather than a raw openssl call, so this also
          # verifies key.pem comes out readable by nginx's container user —
          # not just root, who ran the script (see docs/SERVER-PRODUCTION-PLAN.md D8).
          ./deploy/standalone-tls/generate-cert.sh nginx-check 1
          docker network create nginx-check
          docker run -d --name fake-app --network nginx-check --network-alias app nginx:alpine
          docker run --rm --network nginx-check \
            -v "$PWD/deploy/standalone-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/standalone-tls/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t
          docker rm -f fake-app
          docker network rm nginx-check

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and OCI labels
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
