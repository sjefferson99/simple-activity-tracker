name: Container

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/container.yml"

env:
  IMAGE_NAME: ghcr.io/sjefferson99/simple-activity-tracker-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build (both architectures, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build amd64 only, loaded locally, for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          cache-from: type=gha

      - name: Smoke test /healthz
        run: |
          mkdir -p /tmp/sr-smoke-data
          chmod 777 /tmp/sr-smoke-data
          docker run -d --name smoke -p 8000:8000 \
            -e SR_SECRET_KEY=ci-smoke-test-key-not-a-real-secret-32chars \
            -v /tmp/sr-smoke-data:/data \
            ${{ env.IMAGE_NAME }}:smoke-test
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs smoke
          exit 1

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:smoke-test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Validate deploy/standalone-tls/nginx.conf
        run: |
          # nginx -t resolves `proxy_pass http://app:8000` upstreams at parse
          # time, so it needs *something* answering to the hostname "app" —
          # a throwaway container on a dedicated network alias is enough,
          # nginx never actually proxies a request to it. Uses the real
          # generate-cert.sh (certs/*.pem are gitignored, so nothing here
          # gets committed) rather than a raw openssl call, so this also
          # verifies key.pem comes out readable by nginx's container user —
          # not just root, who ran the script (see docs/SERVER-PRODUCTION-PLAN.md D8).
          ./deploy/standalone-tls/generate-cert.sh nginx-check 1
          docker network create nginx-check
          docker run -d --name fake-app --network nginx-check --network-alias app nginx:alpine
          docker run --rm --network nginx-check \
            -v "$PWD/deploy/standalone-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/standalone-tls/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t
          docker rm -f fake-app
          docker network rm nginx-check

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
