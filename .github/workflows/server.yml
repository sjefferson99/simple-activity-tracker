name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v4.2.0
        with:
          version: "0.5.11"

      - run: uv sync

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv run python -m app.openapi_export | diff - openapi.json
        env:
          SR_SECRET_KEY: ci-openapi-export-placeholder-not-a-real-secret-key

      - name: Dependency audit (pip-audit)
        run: |
          # pip-audit can't parse the "-e ." editable-install line uv export
          # emits for this package itself; strip it, third-party pins only.
          uv export --no-dev --format requirements-txt --no-hashes | grep -v '^-e ' > /tmp/requirements.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements.txt --strict

