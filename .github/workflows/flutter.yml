name: Flutter

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
