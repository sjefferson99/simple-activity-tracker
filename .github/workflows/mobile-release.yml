name: Mobile release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write Android release signing config
        # android/key.properties is gitignored and never committed — written
        # fresh from repo secrets on every run. build.gradle.kts reads it and
        # signs the release build with the real keystore whenever it's
        # present; without it (any build outside this workflow), release
        # builds fall back to Flutter's debug keystore, matching prior
        # behavior. The keystore blob itself is decoded straight into
        # android/app, which .gitignore also excludes (*.jks/*.keystore).
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Rename APK for release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/simple-activity-tracker-${{ steps.version.outputs.version_name }}.apk"

      - name: Attach APK to the GitHub Release for this tag
        # Uploads to the release matching this tag without touching its title
        # or body — the release itself (notes included) is authored by hand
        # in the GitHub UI, same tag/publish action that triggers this push.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: mobile/dist/*.apk
