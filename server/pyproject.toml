[project]
name = "simple-runner-server"
version = "0.1.0"
description = "Self-hosted web app and API for Simple Runner: stores runs, computes analysis, syncs with the mobile app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.2",
    "itsdangerous>=2.2",
    "gpxpy>=1.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
]

[project.scripts]
simple-runner-server = "app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
