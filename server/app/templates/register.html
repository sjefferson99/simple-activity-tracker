{% extends "base.html" %}
{% block title %}Register — Simple Runner{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 3rem auto;">
  <h1>Create an account</h1>
  {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
  <form hx-post="/register" hx-target="body">
    <label for="display_name">Name</label>
    <input type="text" id="display_name" name="display_name" required autofocus value="{{ display_name or '' }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required value="{{ email or '' }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">
    <button type="submit">Register</button>
  </form>
  <p class="muted" style="margin-top:1rem;">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
