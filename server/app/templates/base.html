<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simple Activity Tracker{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-Requested-With": "htmx"}'>
  <header class="topbar">
    <a class="brand" href="/">Simple Activity Tracker</a>
    {% if user %}
    <nav class="topnav">
      <a href="/">Activities</a>
      <a href="/devices">Devices</a>
      <a href="/settings">Settings</a>
      {% if user.is_admin %}<a href="/admin/users">Admin</a>{% endif %}
      <span class="current-user">{{ user.display_name }}</span>
      <button class="link-button" hx-post="/logout" hx-target="body">Sign out</button>
    </nav>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/htmx/htmx.min.js"></script>
  <script nonce="{{ csp_nonce(request) }}">
    // Login/register/settings/admin forms render an error fragment with a
    // non-2xx status (401/400/409) so a real page load shows the right HTTP
    // status too — but htmx's default responseHandling only swaps 2xx/3xx,
    // so without this override those error fragments would never appear.
    htmx.config.responseHandling = [
      { code: "204", swap: false },
      { code: "[23]..", swap: true },
      { code: "[45]..", swap: true, error: false },
    ];
    // Nothing uses hx-on/eval-style attributes — disable eval outright so
    // the CSP's script-src nonce can't be worked around via htmx internals.
    htmx.config.allowEval = false;
    htmx.config.inlineScriptNonce = "{{ csp_nonce(request) }}";

    // Server-rendered timestamps are UTC ISO strings in <time datetime="…">;
    // format them in the viewer's own timezone rather than showing UTC — see
    // R7 in docs/SERVER-PRODUCTION-PLAN.md. Runs on load and again after any
    // htmx swap, since partials (device/session/admin-user lists) bring in
    // their own <time> elements.
    function formatLocalTimes(root) {
      root.querySelectorAll("time.local-time[datetime]").forEach((el) => {
        const date = new Date(el.getAttribute("datetime"));
        if (isNaN(date.getTime())) return;
        const dateOpts = { year: "numeric", month: "short", day: "numeric" };
        const timeOpts = { hour: "2-digit", minute: "2-digit" };
        el.textContent =
          el.dataset.format === "date"
            ? date.toLocaleDateString(undefined, dateOpts)
            : `${date.toLocaleDateString(undefined, dateOpts)}, ${date.toLocaleTimeString(undefined, timeOpts)}`;
      });
    }
    formatLocalTimes(document);
    document.body.addEventListener("htmx:afterSettle", (event) => formatLocalTimes(event.target));
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
