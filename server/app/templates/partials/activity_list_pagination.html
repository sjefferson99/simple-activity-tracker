{% if per_page != "all" and total_pages > 1 %}
<nav class="pagination" aria-label="Activity list pages">
  {% for p in range(1, total_pages + 1) %}
  {% set url = list_url(list_query, page=p) %}
  <a href="{{ url }}"
     hx-get="{{ url }}"
     hx-target="#activity-list-region" hx-select="#activity-list-region" hx-swap="outerHTML" hx-push-url="true"
     hx-indicator="#activity-list-spinner"
     class="page-link{% if p == page %} active{% endif %}"
     {% if p == page %}aria-current="page"{% endif %}>{{ p }}</a>
  {% endfor %}
</nav>
{% endif %}
