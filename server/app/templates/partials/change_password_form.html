{% if success %}
<p style="color: var(--ok);">Password changed. Other signed-in devices have been signed out.</p>
{% endif %}
{% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
<form hx-put="/settings/password" hx-target="#password-form-area">
  <label for="current_password">Current password</label>
  <div class="password-field">
    <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
    <button type="button" class="password-toggle" data-for="current_password" aria-pressed="false">Show</button>
  </div>
  <label for="new_password">New password</label>
  <div class="password-field">
    <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">
    <button type="button" class="password-toggle" data-for="new_password" aria-pressed="false">Show</button>
  </div>
  <button type="submit">Change password</button>
</form>
