<tr id="admin-user-row-{{ u.id }}">
  <td colspan="6">
    {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
    <form hx-post="/admin/users/{{ u.id }}/password"
          hx-target="#admin-user-row-{{ u.id }}" hx-swap="outerHTML"
          style="display:flex; align-items:center; gap:0.5rem; margin:0;">
      <label for="new-password-{{ u.id }}" class="muted" style="margin:0;">New password for {{ u.email }}:</label>
      <div class="password-field" style="flex:1; margin:0;">
        <input type="password" id="new-password-{{ u.id }}" name="new_password" minlength="8" required autofocus autocomplete="new-password" style="width:auto; margin:0;">
        <button type="button" class="password-toggle" data-for="new-password-{{ u.id }}" aria-pressed="false">Show</button>
      </div>
      <button type="submit" style="margin:0;">Save</button>
      <button type="button" class="secondary" style="margin:0;"
              hx-get="/admin/users/{{ u.id }}/password-form/cancel"
              hx-target="#admin-user-row-{{ u.id }}" hx-swap="outerHTML">
        Cancel
      </button>
    </form>
  </td>
</tr>
