# Terminates TLS with the self-signed cert from ./certs (see generate-cert.sh)
# and forwards to the app service over the compose network. Sets the headers
# app/config.py needs to trust (scheme + client IP) — the app only honours
# these from SR_TRUSTED_PROXIES, set to the compose network range in .env.
#
# Security response headers (CSP, HSTS, nosniff, etc.) are set by the app
# itself (app/security_headers.py) so they apply the same way behind any
# reverse proxy, not just this one — this file only hardens nginx's own
# behaviour and doesn't duplicate the app's headers, except HSTS (harmless
# to send twice; app.py already gates it on secure_cookies).

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                  'urt=$upstream_response_time';

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;   # a little above SR_MAX_GPX_BYTES (default 20MB) so nginx never clips an upload before the app's own check runs

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    client_body_timeout 60s;

    gzip on;
    gzip_types application/json text/css application/javascript;

    access_log /var/log/nginx/access.log timed;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rate-limited auth endpoints — a login/register spray still reaches the
    # app's own limiter (app/auth/rate_limit.py), but this gives a cheap
    # first line of defense before Python even sees the request.
    location ~ ^/(login|register|api/v1/auth/login)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
