# Standalone deployment with a self-signed cert — no external reverse proxy
# required. Use this for a homelab box, a Pi, or to test HTTPS end-to-end.
#
# TLS is terminated by the `proxy` nginx container, never by `app` — TLS has
# always been out of scope for the app container itself (docs/WEB-PLAN.md
# §5.6). Swapping in a different reverse proxy later means deleting the
# `proxy` service and its published ports, pointing the new proxy at
# `app:8000`, and adjusting SR_TRUSTED_PROXIES — `app` itself does not change.
#
# Generate the cert first: ./generate-cert.sh <your-hostname-or-IP>
#
# Pulls the published image (same one CI pushes on every merge to `main`) —
# for local development against an unreleased server change instead, use
# ../docker-compose.yml, which builds from ../../server.

services:
  app:
    image: ghcr.io/sjefferson99/simple-activity-tracker-server:latest
    expose:
      - "8000"                 # reached by `proxy` over the compose network only — not published to the host
    env_file:
      - .env
    secrets:
      - SR_SECRET_KEY
    volumes:
      - ./data:/data
    read_only: true             # the app only ever writes under /data (bind-mounted above) or /tmp
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Healthcheck is baked into the image (server/Dockerfile) — no override needed here.

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"                 # plain-http → https redirect only, see nginx.conf
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx's master process starts as root (to bind 80/443) then drops
    # privilege to the "nginx" worker user and chowns its cache dirs under
    # /var/cache/nginx — cap_drop: ALL alone breaks startup with
    # "chown(...) Operation not permitted"; these four are the minimum
    # re-added to let it do that.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # --no-check-certificate: the cert is self-signed (see generate-cert.sh);
      # this only proves nginx is up and proxying to app, not that the cert
      # chain validates. /healthz (not /) so the check doesn't depend on
      # BusyBox wget's default of following redirects out to some other host.
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

secrets:
  SR_SECRET_KEY:
    file: ./secrets/secret_key.txt
